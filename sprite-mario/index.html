<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5c94fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>超级马里奥 · SUPER MARIO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- 触屏虚拟按键 -->
  <div id="touch-controls" class="hidden">
    <div id="dpad">
      <button class="tbtn" id="btn-left" data-key="left">◀</button>
      <button class="tbtn" id="btn-right" data-key="right">▶</button>
      <button class="tbtn" id="btn-jump" data-key="jump">▲</button>
    </div>
    <div id="action-btns">
      <button class="tbtn" id="btn-fire" data-key="fire">●</button>
    </div>
  </div>
</div>

<!-- 由 main.js 动态注入 UI 层 -->
<div id="overlay"></div>

<!-- 单文件构建版(非模块，file:// 可直接双击运行) -->
<script src="js/game.all.js"></script>
</body>
</html>
